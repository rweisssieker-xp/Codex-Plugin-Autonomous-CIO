<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Autonomous CIO Local App</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f6f7f9; color: #172026; }
    header { padding: 16px 20px; background: #fff; border-bottom: 1px solid #d8dee4; }
    main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; }
    section { background: #fff; border: 1px solid #d8dee4; border-radius: 8px; padding: 12px; }
    textarea, input, select { width: 100%; box-sizing: border-box; margin: 6px 0 10px; padding: 8px; border: 1px solid #cfd6dd; border-radius: 6px; }
    button { margin: 4px 4px 4px 0; padding: 8px 10px; border: 1px solid #0f766e; background: #0f766e; color: #fff; border-radius: 6px; cursor: pointer; }
    pre { white-space: pre-wrap; overflow: auto; max-height: 70vh; background: #111827; color: #e5e7eb; padding: 12px; border-radius: 8px; }
    .muted { color: #5b6570; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>The Autonomous CIO</h1>
    <div class="muted">Local CIO Operating System: build packets, inspect memory, run policy checks, export packs and record explicit learning feedback.</div>
  </header>
  <main>
    <section>
      <h2>Input</h2>
      <label>Context JSON</label>
      <textarea id="context" rows="16">{
  "decision_request": "Prepare a board decision on ERP go-live",
  "context": [
    "Testing has not started because the environment is late.",
    "Audit evidence for change control is incomplete.",
    "Budget reserve is nearly consumed."
  ]
}</textarea>
      <label>Bundle directory</label>
      <input id="bundle" value="engine/examples">
      <label>Output directory</label>
      <input id="outputDir" value=".local-export/web-board-pack">
      <label>Policy</label>
      <select id="policy"><option>security</option><option>audit</option><option>ai-governance</option><option>change-control</option><option>privacy</option><option>vendor-risk</option></select>
      <button onclick="postContext('/api/decision-packet')">Decision Packet</button>
      <button onclick="postContext('/api/dashboard')">Dashboard Data</button>
      <button onclick="postContext('/api/policy', {policy: policy.value})">Policy</button>
      <button onclick="postContext('/api/board-pack', {output_dir: outputDir.value, format: 'both'})">Export Board Pack</button>
      <button onclick="postBundle()">Ingest Bundle</button>
      <button onclick="postContext('/api/save-review', {db: '.local-memory/autonomous_cio.db'})">Save Review</button>
      <button onclick="recordFeedback()">Record Feedback</button>
      <button onclick="recordOutcome()">Record Outcome</button>
      <button onclick="get('/api/learning')">Learning Digest</button>
      <button onclick="get('/api/decision-dna')">Decision DNA</button>
      <button onclick="get('/api/weekly-operating-autopilot')">Weekly Autopilot</button>
      <button onclick="get('/api/enterprise-ledger')">Decision Ledger</button>
      <button onclick="postContext('/api/simulation-arena')">Simulation Arena</button>
      <button onclick="postContext('/api/delegation-planner')">Delegation Planner</button>
      <button onclick="postContext('/api/narrative-integrity')">Narrative Integrity</button>
      <button onclick="get('/api/evals')">Run Evals</button>
    </section>
    <section>
      <h2>Output</h2>
      <pre id="out">Ready.</pre>
    </section>
  </main>
  <script>
    function parsedContext() { return JSON.parse(document.getElementById('context').value); }
    async function postContext(path, extra) {
      const payload = Object.assign({ context: parsedContext() }, extra || {});
      const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
    }
    async function postBundle() {
      const payload = { input: document.getElementById('bundle').value };
      const res = await fetch('/api/ingest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
    }
    async function recordFeedback() {
      const payload = { feedback: { packet_id: 'web-demo', decision: parsedContext().decision_request || 'Local decision', rating: 5, accepted: true, notes: 'Recorded from local web app.' }, db: '.local-memory/autonomous_cio.db' };
      const res = await fetch('/api/record-feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
    }
    async function recordOutcome() {
      const payload = { outcome: { packet_id: 'web-demo', decision: parsedContext().decision_request || 'Local decision', actual_outcome: 'Outcome review pending; replace with real post-decision result.', score_accuracy: 70, realized_risks: [], value_result: 'Pending validation.' }, db: '.local-memory/autonomous_cio.db' };
      const res = await fetch('/api/record-outcome', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
    }
    async function get(path) {
      const res = await fetch(path);
      document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
    }
  </script>
</body>
</html>
